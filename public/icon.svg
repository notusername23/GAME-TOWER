<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#060913" />
    </radialGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#701a75" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="crystalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)" />
  
  <!-- Cyber Grid Lines -->
  <g stroke="#1e293b" stroke-width="2" opacity="0.8">
    <line x1="64" y1="0" x2="64" y2="512" />
    <line x1="128" y1="0" x2="128" y2="512" />
    <line x1="192" y1="0" x2="192" y2="512" />
    <line x1="256" y1="0" x2="256" y2="512" />
    <line x1="320" y1="0" x2="320" y2="512" />
    <line x1="384" y1="0" x2="384" y2="512" />
    <line x1="448" y1="0" x2="448" y2="512" />
    
    <line x1="0" y1="64" x2="512" y2="64" />
    <line x1="0" y1="128" x2="512" y2="128" />
    <line x1="0" y1="192" x2="512" y2="192" />
    <line x1="0" y1="256" x2="512" y2="256" />
    <line x1="0" y1="320" x2="512" y2="320" />
    <line x1="0" y1="384" x2="512" y2="384" />
    <line x1="0" y1="448" x2="512" y2="448" />
  </g>

  <!-- Outer Defense Ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#neonCyan)" stroke-width="8" stroke-dasharray="24 12" filter="url(#glow)" />
  <circle cx="256" cy="256" r="160" fill="none" stroke="#6366f1" stroke-width="3" opacity="0.7" />

  <!-- Tactical Cardinal Nodes -->
  <circle cx="256" cy="66" r="12" fill="#38bdf8" />
  <circle cx="256" cy="446" r="12" fill="#38bdf8" />
  <circle cx="66" cy="256" r="12" fill="#38bdf8" />
  <circle cx="446" cy="256" r="12" fill="#38bdf8" />

  <!-- Nexus Central Crystal Diamond -->
  <polygon points="256,110 376,256 256,402 136,256" fill="url(#crystalGrad)" opacity="0.85" filter="url(#glow)" />
  <polygon points="256,140 346,256 256,372 166,256" fill="#090d16" opacity="0.9" />

  <!-- Energy Pulse Lines -->
  <line x1="256" y1="140" x2="256" y2="372" stroke="#38bdf8" stroke-width="4" />
  <line x1="166" y1="256" x2="346" y2="256" stroke="#38bdf8" stroke-width="4" />

  <!-- Inner Core Heat Pulse -->
  <circle cx="256" cy="256" r="64" fill="url(#coreGlow)" filter="url(#glow)" />
  <circle cx="256" cy="256" r="24" fill="#ffffff" />
</svg>
